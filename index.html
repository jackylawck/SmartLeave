<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans flex flex-col justify-between">

                    <option value="TC">繁體中文</option>
                    <option value="EN">English</option>
                </select>
            </div>
        </header>

        <section aria-labelledby="lblMode" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-700/50 p-4 rounded-lg border border-slate-600/50">
            <div>
                <label for="modeSelect" class="block text-xs text-slate-400 mb-1 font-semibold tracking-wide uppercase" id="lblMode">使用身份</label>
                <select id="modeSelect" aria-labelledby="lblMode" class="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-400 transition-colors">
                    <option value="EMP" id="optEmp">🏖️ 員工：請假攻略、天氣、交通與健康提示</option>
                    <option value="HR" id="optHR">📊 HR / 管理層：連假人手與交通提醒</option>
                </select>
            </div>
            <div>
                <label for="yearSelect" class="block text-xs text-slate-400 mb-1 font-semibold tracking-wide uppercase" id="lblYear">目標年份</label>
                <select id="yearSelect" aria-labelledby="lblYear" class="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-400 transition-colors">
                    <option value="2026" id="optYear2026">2026 年</option>
                    <option value="2027" id="optYear2027">2027 年</option>
                </select>
            </div>
        </section>

        <div id="apiStatus" role="status" aria-live="polite" class="mb-6 p-3.5 rounded-lg text-sm bg-slate-800 border border-slate-600 text-slate-300 flex items-center shadow-inner">
            <span class="mr-2 text-lg" aria-hidden="true">⏳</span> <span id="statusText">正在更新最新數據... / Loading latest data...</span>
        </div>

        <section id="contentArea" aria-label="請假計算與決策面板" class="min-h-[250px]"></section>
