<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartLeave 智休假 | 香港請假攻略與出行助手</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* 隱藏滾動條但保持滑動 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8 font-sans flex flex-col">
    <div class="max-w-5xl w-full mx-auto bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700 flex-grow">
        
        <!-- 頂部標題 & 語言切換 -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-slate-700 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold text-emerald-400" id="title">SmartLeave 智休假</h1>
                <p class="text-slate-400 text-sm mt-1" id="subtitle">香港請假攻略 & 天氣交通出行助手</p>
            </div>
            <select id="langSelect" onchange="toggleLanguage()" class="mt-4 md:mt-0 bg-slate-700 text-white px-3 py-1.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-400 transition-colors">
                <option value="TC">繁體中文</option>
                <option value="EN">English</option>
            </select>
        </div>

        <!-- 模式與年份設定 -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 bg-slate-700/50 p-4 rounded-lg border border-slate-600/50">
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold tracking-wide uppercase" id="lblMode">使用身份</label>
                <select id="modeSelect" onchange="renderUI()" class="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-400 transition-colors">
                    <option value="EMP" id="optEmp">🏖️ 員工：請假攻略、天氣與匯率</option>
                    <option value="HR" id="optHR">📊 HR / 管理層：連假人手與交通提醒</option>
                </select>
            </div>
            <div>
                <label class="block text-xs text-slate-400 mb-1 font-semibold tracking-wide uppercase" id="lblYear">目標年份</label>
                <select id="yearSelect" onchange="renderUI()" class="w-full bg-slate-800 text-white p-2.5 rounded-lg border border-slate-600 focus:outline-none focus:border-emerald-400 transition-colors">
                    <option value="2026" id="optYear2026">2026 年</option>
                    <option value="2027" id="optYear2027">2027 年</option>
                </select>
            </div>
        </div>

        <!-- 連線狀態 Banner -->
        <div id="apiStatus" class="mb-6 p-3.5 rounded-lg text-sm bg-slate-800 border border-slate-600 text-slate-300 flex items-center shadow-inner">
            <span class="mr-2 text-lg">⏳</span> <span id="statusText">正在更新最新數據... / Loading latest data...</span>
        </div>

        <!-- 天氣與交通面板 -->
        <div id="globalDashboardWidget" class="mb-6"></div>

        <!-- 內容展示區 -->
        <div id="contentArea" class="min-h-[250px]"></div>

    </div>

    <!-- 隱私聲明 Footer -->
    <div class="max-w-5xl w-full mx-auto mt-6 p-4 bg-slate-800/80 rounded-lg border border-slate-700 text-xs text-slate-400 leading-relaxed shadow-lg">
        <div class="flex items-start">
            <span class="text-emerald-500 text-lg mr-2">🔒</span>
            <div>
                <strong class="text-slate-300 block mb-1" id="govTitle">隱私與安全保障：</strong>
                <p id="govText">本工具所有運算均在您的瀏覽器內完成（包括日曆下載），您的請假資料絕不會傳送到任何外部伺服器。同時支援離線使用，斷網時也能隨時查看休假攻略。</p>
            </div>
        </div>
    </div>

    <script>
        const i18n = {
            TC: {
                title: "SmartLeave 智休假",
                subtitle: "香港請假攻略 & 天氣交通出行助手",
                lblMode: "使用身份",
                optEmp: "🏖️ 員工：請假攻略、天氣與匯率",
                optHR: "📊 HR / 管理層：連假人手與交通提醒",
                lblYear: "目標年份",
                optYear2026: "2026 年",
                optYear2027: "2027 年",
                statusSuccess: "系統狀態：已連線至香港政府 1823、天文台、運輸署及全球天氣匯率資料庫",
                statusFallback: "系統狀態：目前為離線模式，已載入預存的 2026-2027 假期資料",

                cpTooltip: "計算方式：連續放假總天數 ÷ 扣除的年假天數",
                hrNote: "管理提醒：請留意長假前後的請假重疊情況，並留意運輸署交通消息與天氣狀況，方便彈性安排工作與人手調配。",
                hrAlert2026: "⚠️ 2026 人手緊張期：4月3日 至 4月12日 (復活節及清明連休 10 天)",
                hrAlert2027: "⚠️ 2027 人手緊張期：3月26日 至 4月5日 (復活節及清明連休 11 天)",
                noResult: "目前的年假天數較少，建議單獨請假放鬆！",
                govTitle: "隱私與安全保障：",
                govText: "本工具所有運算均在您的瀏覽器內完成（包括日曆下載），您的請假資料絕不會傳送到任何外部伺服器。同時支援離線使用，斷網時也能隨時查看休假攻略。",
                citySelectLabel: "🌍 目的地預測 (未來 9 天天氣趨勢):",
                globalWeatherTitle: "🌐 天氣與匯率動態",
                btnCalendar: "📅 加入手機日曆 (.ics)",
                esgTitle: "🚦 交通與出行狀況",
                trafficNormal: "✅ 運輸署即時消息：目前全港主要幹道及港鐵服務正常。",
                esgAirport: "✈️ 機場提示: 連假首日為出行高峰，建議提早到達機場。"
            },
            EN: {
                title: "SmartLeave",
                subtitle: "HK Leave Optimizer & Travel Assistant",
                lblMode: "I am an...",
                optEmp: "🏖️ Employee: Leave Guide, Weather & FX",
                optHR: "📊 HR / Manager: Leave Overlap & Traffic Alerts",
                lblYear: "Target Year",
                optYear2026: "2026",
                optYear2027: "2027",
                statusSuccess: "System Status: Connected to HK Gov 1823, HKO, Transport Dept & Global APIs",
                statusFallback: "System Status: Offline mode active. Loaded pre-saved 2026-2027 holiday database",
                inputAL: "Enter AL Days you want to use:",
                btnCalc: "🚀 Calculate Best Leave",
                cpLabel: "Value Ratio",
                cpTooltip: "Formula: Total Days Off ÷ Required AL Days",
                hrNote: "Manager Tip: Monitor leave overlap during long weekends and keep an eye on transit updates for flexible work arrangements.",
                hrAlert2026: "⚠️ 2026 Peak Absence Period: Apr 3 - Apr 12 (Easter 10-day streak)",
                hrAlert2027: "⚠️ 2027 Peak Absence Period: Mar 26 - Apr 5 (Easter 11-day streak)",
                noResult: "AL days insufficient for long streaks. Taking single days off is recommended!",
                govTitle: "Privacy & Security Guarantee:",
                govText: "All calculations happen locally in your browser (including calendar exports). Your data is never sent to external servers. Works offline seamlessly.",
                citySelectLabel: "🌍 Select Destination (9-Day Forecast Trend):",
                globalWeatherTitle: "🌐 Live Weather & Exchange Rate",
                btnCalendar: "📅 Add to Calendar (.ics)",
                esgTitle: "🚦 Transit & Travel Updates",
                trafficNormal: "✅ Transport Dept Update: Major roadways and MTR operating normally.",
                esgAirport: "✈️ Airport Advisory: High traffic expected on holiday start dates. Early arrival recommended."
            }
        };

        const CITIES = [
            { id: "HK", nameTC: "香港 (Hong Kong)", nameEN: "Hong Kong", currency: "HKD" },
            { id: "TYO", nameTC: "東京 (Tokyo)", nameEN: "Tokyo", lat: 35.6762, lng: 139.6503, currency: "JPY" },
            { id: "OSA", nameTC: "大阪 (Osaka)", nameEN: "Osaka", lat: 34.6937, lng: 135.5023, currency: "JPY" },
            { id: "TPE", nameTC: "台北 (Taipei)", nameEN: "Taipei", lat: 25.0330, lng: 121.5654, currency: "TWD" },
            { id: "SEL", nameTC: "首爾 (Seoul)", nameEN: "Seoul", lat: 37.5665, lng: 126.9780, currency: "KRW" },
            { id: "BKK", nameTC: "曼谷 (Bangkok)", nameEN: "Bangkok", lat: 13.7563, lng: 100.5018, currency: "THB" },
            { id: "SIN", nameTC: "新加坡 (Singapore)", nameEN: "Singapore", lat: 1.3521, lng: 103.8198, currency: "SGD" },
            { id: "LON", nameTC: "倫敦 (London)", nameEN: "London", lat: 51.5074, lng: -0.1278, currency: "GBP" },
            { id: "PAR", nameTC: "巴黎 (Paris)", nameEN: "Paris", lat: 48.8566, lng: 2.3522, currency: "EUR" },
            { id: "SYD", nameTC: "雪梨 (Sydney)", nameEN: "Sydney", lat: -33.8688, lng: 151.2093, currency: "AUD" }
        ];

        let currentLang = 'TC';
        let selectedCityIndex = 0;
        let ratesData = null;
        let tdTrafficMsg = null;

        async function initAPI() {
            const statusEl = document.getElementById('apiStatus');
            const txtEl = document.getElementById('statusText');
            
            try {
                // 1. 1823 & FX
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://www.1823.gov.hk/datagovhk/v2/1823_cal_tc.json');
                fetch(proxyUrl).catch(() => null);
                
                const fxUrl = 'https://api.frankfurter.app/latest?from=HKD&to=JPY,TWD,GBP,THB,SGD,EUR,AUD';
                const resFx = await fetch(fxUrl).catch(() => null);
                if (resFx && resFx.ok) {
                    const fxJson = await resFx.json();
                    ratesData = fxJson.rates;
                }

                // 2. 運輸署 (TD) 交通消息
                const tdUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://ws.td.gov.hk/en/specialtrafficnews.xml');
                fetch(tdUrl).then(r => r.text()).then(str => {
                    if (str && str.includes('<msgHeader>')) {
                        tdTrafficMsg = "⚠️ 運輸署特別交通消息：部分路段或交通工具可能受阻，請留意出行安排。";
                    }
                }).catch(() => null);

                txtEl.innerText = i18n[currentLang].statusSuccess;
                statusEl.className = "mb-6 p-3.5 rounded-lg text-sm bg-emerald-900/30 border border-emerald-500/50 text-emerald-300 font-medium tracking-wide flex items-center shadow-inner";
                statusEl.querySelector('span').innerText = "✅";
                renderDashboardWidget();
                
            } catch (e) {
                txtEl.innerText = i18n[currentLang].statusFallback;
                statusEl.className = "mb-6 p-3.5 rounded-lg text-sm bg-blue-900/30 border border-blue-500/50 text-blue-300 font-medium tracking-wide flex items-center shadow-inner";
                statusEl.querySelector('span').innerText = "🛡️";
                renderDashboardWidget();
            }
        }

        async function renderDashboardWidget() {
            const mode = document.getElementById('modeSelect').value;
            const city = CITIES[selectedCityIndex];
            const container = document.getElementById('globalDashboardWidget');
            const txt = i18n[currentLang];

            if (mode === 'EMP') {
                let weatherHtml = `<div class="text-xs text-slate-400 p-2">載入 9 天天氣預報中...</div>`;

                if (city.id === "HK") {
                    try {
                        const targetHkoUrl = 'https://data.weather.gov.hk/weatherAPI/opendata/weather.php?dataType=fnd&lang=' + (currentLang === 'TC' ? 'tc' : 'en');
                        const hkoProxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetHkoUrl);

                        const res = await fetch(hkoProxyUrl);
                        if (res.ok) {
                            const data = await res.json();
                            weatherHtml = data.weatherForecast.slice(0, 9).map(f => `
                                <div class="bg-slate-800/90 min-w-[110px] p-2.5 rounded border border-emerald-600/40 text-xs text-center flex-shrink-0 shadow-md">
                                    <div class="font-bold text-emerald-400 mb-1">${f.forecastDate.substring(4,6)}-${f.forecastDate.substring(6,8)} (${f.week})</div>
                                    <div class="text-slate-200">🌡️ ${f.forecastMintemp.value}~${f.forecastMaxtemp.value}°C</div>
                                    <div class="text-[10px] text-slate-400 mt-1">💧 ${f.forecastRhi.value}% 濕度</div>
                                </div>
                            `).join('');
                        }
                    } catch (e) {
                        weatherHtml = `<div class="text-xs text-slate-400 p-2">香港天氣資料暫時離線</div>`;
                    }
                } else {
                    try {
                        const url = `https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lng}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;
                        const res = await fetch(url);
                        if (res.ok) {
                            const data = await res.json();
                            weatherHtml = data.daily.time.slice(0, 9).map((t, idx) => `
                                <div class="bg-slate-800/90 min-w-[100px] p-2.5 rounded border border-slate-700 text-xs text-center flex-shrink-0 shadow-md">
                                    <div class="font-bold text-emerald-400 mb-1">${t.substring(5)}</div>
                                    <div class="text-slate-200">🌡️ ${data.daily.temperature_2m_min[idx]}~${data.daily.temperature_2m_max[idx]}°C</div>
                                </div>
                            `).join('');
                        }
                    } catch (e) { weatherHtml = `<div class="text-xs text-slate-400 p-2">海外天氣資料暫時離線</div>`; }
                }

                let rateHtml = "";
                if (city.currency === "HKD") {
                    rateHtml = `<span class="text-emerald-300 font-bold ml-2 bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700 text-xs">港幣 (HKD)</span>`;
                } else if (ratesData && ratesData[city.currency]) {
                    rateHtml = `<span class="text-emerald-300 font-bold ml-2 bg-emerald-900/50 px-2 py-1 rounded border border-emerald-700 text-xs">1 HKD ≈ ${ratesData[city.currency]} ${city.currency}</span>`;
                } else {
                    rateHtml = `<span class="text-slate-400 text-xs ml-2">匯率離線</span>`;
                }

                const cityOptions = CITIES.map((c, idx) => `
                    <option value="${idx}" ${idx === selectedCityIndex ? 'selected' : ''}>
                        ${currentLang === 'TC' ? c.nameTC : c.nameEN}
                    </option>
                `).join('');

                container.innerHTML = `
                    <div class="bg-slate-700/30 p-4 rounded-lg border border-slate-700/80 shadow-md">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-3 gap-2">
                            <div>
                                <label class="text-xs font-semibold text-slate-300 uppercase tracking-wide mr-2">${txt.citySelectLabel}</label>
                                <select onchange="changeCity(this.value)" class="bg-slate-800 text-sm text-emerald-300 px-3 py-1.5 rounded border border-slate-600 focus:outline-none focus:border-emerald-500">
                                    ${cityOptions}
                                </select>
                            </div>
                            <div class="flex items-center">
                                <span class="text-xs text-slate-400 mr-1">💱 參考匯率:</span> ${rateHtml}
                            </div>
                        </div>
                        <div class="flex gap-2.5 overflow-x-auto no-scrollbar pb-2 pt-1">
                            ${weatherHtml}
                        </div>
                    </div>
                `;
            } else {
                const trafficAlertText = tdTrafficMsg || txt.trafficNormal;
                container.innerHTML = `
                    <div class="bg-slate-700/30 p-5 rounded-lg border border-slate-700/80 shadow-md">
                        <h3 class="text-sm font-bold text-slate-200 uppercase tracking-wider mb-4 flex items-center border-b border-slate-600 pb-2">
                            ${txt.esgTitle}
                        </h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div class="bg-slate-800 p-3 rounded-lg border border-slate-600/50 shadow-inner flex items-start">
                                <span class="text-xl mr-3">🚇</span>
                                <p class="text-xs text-slate-300 leading-relaxed">${trafficAlertText}</p>
                            </div>
                            <div class="bg-slate-800 p-3 rounded-lg border border-slate-600/50 shadow-inner flex items-start">
                                <span class="text-xl mr-3">✈️</span>
                                <p class="text-xs text-slate-300 leading-relaxed">${txt.esgAirport}</p>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        function changeCity(idx) {
            selectedCityIndex = parseInt(idx);
            renderDashboardWidget();
        }

        function toggleLanguage() {
            currentLang = document.getElementById('langSelect').value;
            const txt = i18n[currentLang];
            
            document.getElementById('title').innerText = txt.title;
            document.getElementById('subtitle').innerText = txt.subtitle;
            document.getElementById('lblMode').innerText = txt.lblMode;
            document.getElementById('optEmp').innerText = txt.optEmp;
            document.getElementById('optHR').innerText = txt.optHR;
            document.getElementById('lblYear').innerText = txt.lblYear;
            document.getElementById('optYear2026').innerText = txt.optYear2026;
            document.getElementById('optYear2027').innerText = txt.optYear2027;
            document.getElementById('govTitle').innerText = txt.govTitle;
            document.getElementById('govText').innerText = txt.govText;
            
            renderDashboardWidget();
            renderUI(); 
        }

        function generateICS(title, startDate, endDate) {
            const formatICSDate = (dateStr) => dateStr.replace(/-/g, '') + 'T000000Z';
            const start = formatICSDate(startDate);
            
            let endObj = new Date(endDate);
            endObj.setDate(endObj.getDate() + 1);
            const end = endObj.toISOString().split('T')[0].replace(/-/g, '') + 'T000000Z';

            const icsData = `BEGIN:VCALENDAR
VERSION:2.0
PRODID:-//SmartLeave//HK//EN
CALSCALE:GREGORIAN
BEGIN:VEVENT
SUMMARY:${title} (SmartLeave)
DTSTART:${start}
DTEND:${end}
DESCRIPTION:Generated by SmartLeave - Client-Side Privacy
STATUS:CONFIRMED
END:VEVENT
END:VCALENDAR`;

            const blob = new Blob([icsData], { type: 'text/calendar;charset=utf-8' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.setAttribute('download', `SmartLeave_${startDate}.ics`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function renderUI() {
            const mode = document.getElementById('modeSelect').value;
            const year = document.getElementById('yearSelect').value;
            const txt = i18n[currentLang];
            const content = document.getElementById('contentArea');

            renderDashboardWidget();

            if (mode === 'EMP') {
                content.innerHTML = `
                    <div class="bg-slate-700/30 p-5 rounded-lg border border-slate-700 mb-4">
                        <label class="block text-sm font-medium mb-3 text-slate-200">${txt.inputAL}</label>
                        <div class="flex gap-4">
                            <input type="number" id="alInput" value="3" min="1" max="14" class="bg-slate-800 text-white px-4 py-2.5 rounded-lg border border-slate-600 w-32 focus:outline-none focus:border-emerald-400 transition-colors shadow-inner">
                            <button onclick="calculate()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-6 py-2.5 rounded-lg font-medium transition-all shadow-lg hover:shadow-emerald-900/50">${txt.btnCalc}</button>
                        </div>
                    </div>
                    <div id="resultsGrid" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>
                `;
                calculate(); 
            } else {
                const alertMsg = year === '2026' ? txt.hrAlert2026 : txt.hrAlert2027;
                content.innerHTML = `
                    <div class="bg-slate-700/30 p-6 rounded-lg border border-slate-700">
                        <div class="p-4 bg-rose-900/30 border border-rose-500/50 text-rose-300 rounded-lg font-medium mb-5 flex items-start shadow-inner">
                            <span class="mr-3 text-2xl">🚨</span>
                            <span class="text-lg leading-tight">${alertMsg}</span>
                        </div>
                        <div class="p-5 bg-slate-800 rounded-lg border border-slate-600 shadow-md">
                            <p class="text-sm text-slate-300 leading-relaxed">${txt.hrNote}</p>
                        </div>
                    </div>
                `;
            }
        }

        function calculate() {
            const year = document.getElementById('yearSelect').value;
            const txt = i18n[currentLang];
            const grid = document.getElementById('resultsGrid');
            if(!grid) return;

            const strategyData = {
                '2026': [
                    { start: "2026-04-03", end: "2026-04-12", off: 10, cost: 3, cp: "3.33", nameTC: "復活節連休", nameEN: "Easter Holidays" },
                    { start: "2026-02-14", end: "2026-02-22", off: 9, cost: 3, cp: "3.00", nameTC: "農曆新年", nameEN: "Lunar New Year" },
                    { start: "2026-12-25", end: "2027-01-03", off: 10, cost: 4, cp: "2.50", nameTC: "聖誕跨年", nameEN: "Christmas & NYE" }
                ],
                '2027': [
                    { start: "2027-03-26", end: "2027-04-05", off: 11, cost: 4, cp: "2.75", nameTC: "復活節", nameEN: "Easter Holidays" },
                    { start: "2027-02-06", end: "2027-02-14", off: 9, cost: 3, cp: "3.00", nameTC: "農曆新年", nameEN: "Lunar New Year" }
                ]
            };

            const alInput = parseInt(document.getElementById('alInput').value) || 0;
            const validStrategies = strategyData[year].filter(item => item.cost <= alInput);

            if (validStrategies.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-slate-400 text-sm p-5 bg-slate-800 rounded-lg text-center border border-slate-700 shadow-inner">${txt.noResult}</div>`;
                return;
            }

            grid.innerHTML = validStrategies.map(item => {
                const nameDisplay = currentLang === 'TC' ? item.nameTC : item.nameEN;
                const offDisplay = currentLang === 'TC' ? `放 ${item.off} 日 / 請 ${item.cost} 日` : `${item.off} Days Off / ${item.cost} AL`;

                return `
                <div class="bg-slate-800 p-5 rounded-lg border border-slate-700 shadow-lg flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-start mb-2">
                            <div class="text-xs text-emerald-400 font-mono">🗓️ ${item.start} ~ ${item.end}</div>
                            <div class="text-xs font-semibold bg-emerald-900/40 border border-emerald-700/50 px-2 py-1 rounded text-emerald-300 cursor-help" title="${txt.cpTooltip}">
                                CP: ${item.cp}
                            </div>
                        </div>
                        <div class="text-2xl font-bold text-white mb-2">${offDisplay}</div>
                        <div class="text-sm text-slate-400 mb-4">${nameDisplay}</div>
                    </div>
                    <button onclick="generateICS('${nameDisplay}', '${item.start}', '${item.end}')" class="w-full bg-slate-700 hover:bg-slate-600 border border-slate-600 text-slate-200 text-sm py-2 rounded transition-colors flex items-center justify-center gap-2">
                        ${txt.btnCalendar}
                    </button>
                </div>
                `;
            }).join('');
        }

        initAPI();
        renderUI();
    </script>

    <!-- 離線快取 Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    const CACHE_NAME = 'smartleave-offline-v9';
                    self.addEventListener('install', e => { e.waitUntil(caches.open(CACHE_NAME).then(c => c.addAll(['./']))); });
                    self.addEventListener('fetch', e => { e.respondWith(caches.match(e.request).then(r => r || fetch(e.request))); });
                `;
                const blob = new Blob([swCode], { type: 'application/javascript' });
                navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
            });
        }
    </script>
</body>
</html>
